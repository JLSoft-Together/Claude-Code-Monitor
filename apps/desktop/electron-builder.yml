appId: dev.ccm.monitor
productName: GolAIm
copyright: GolAIm
directories:
  app: stage
  output: release
asar: true
# Chromium ships 55 UI locale packs (~49 MB); the app only speaks en / vi.
electronLanguages:
  - en-US
  - vi
compression: maximum
# utilityProcess.fork runs collector.cjs from disk, outside the archive.
asarUnpack:
  - collector.cjs
  - pty-host.cjs
npmRebuild: false
nodeGypRebuild: false
files:
  - main.cjs
  - collector.cjs
  - pty-host.cjs
  - preload.cjs
  - package.json
extraResources:
  # node-pty + the prebuilt package for this platform/arch (npm installs only the host one).
  - from: ../../node_modules/@lydell
    to: pty/node_modules/@lydell
  - from: ../web/dist
    to: web
  - from: ../layout-daemon/build/libs/layout-daemon.jar
    to: layout-daemon/layout-daemon.jar
  - from: ../layout-daemon/build/loose-kit
    to: layout-daemon/loose-kit
  - from: ../layout-daemon/init/ccm-project-model.gradle
    to: layout-daemon/ccm-project-model.gradle
  - from: ../../scripts/statusline-bridge.mjs
    to: bridge/statusline-bridge.mjs
  - from: ../../scripts/assets/ccm.ico
    to: ccm.ico
  - from: ../../scripts/assets/ccmTrayTemplate.png
    to: ccmTrayTemplate.png
  - from: ../../scripts/assets/ccmTrayTemplate@2x.png
    to: ccmTrayTemplate@2x.png
mac:
  icon: ../../scripts/assets/ccm-mac.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # No Developer ID yet: ad-hoc signature (arm64 refuses unsigned code), no notarization.
  # Hardened runtime + ad-hoc breaks Electron's library validation, so it stays off.
  identity: '-'
  hardenedRuntime: false
  protocols:
    - name: GolAIm
      schemes: [agent-monitor]
dmg:
  artifactName: GolAIm-${version}-${arch}.${ext}
win:
  icon: ../../scripts/assets/ccm.ico
  # koffi (native process table, collector/src/win-procs.ts): loader + the host's prebuilt only; macOS uses ps.
  extraResources:
    - from: ../../node_modules/koffi
      to: koffi/node_modules/koffi
      filter: [package.json, LICENSE.txt, index.cjs, src/koffi/index.cjs, src/koffi/src/*.cjs]
    - from: ../../node_modules/@koromix
      to: koffi/node_modules/@koromix
      filter: ['koffi-win32-*/**']
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GolAIm
  artifactName: GolAIm-Setup-${version}.${ext}
portable:
  artifactName: GolAIm-Portable-${version}.${ext}
