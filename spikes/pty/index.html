<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:*">
  <title>CCM PTY spike</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <style>
    :root { --bg: #14161a; --panel: #1c1f24; --line: #2b2f36; --text: #d6d9de; --muted: #8a919c; --accent: #5b8cff; --bad: #ff6b6b; --ok: #4fd18b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px "Google Sans", system-ui, sans-serif; overflow: hidden; }
    body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    header, footer { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    footer { border-top: 1px solid var(--line); border-bottom: 0; color: var(--muted); font-size: 12px; }
    button, select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    #term { min-height: 0; padding: 4px 0 0 6px; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    #log { max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <select id="preset" aria-label="Preset">
      <option value="shell">Shell</option>
      <option value="claude">Claude Code</option>
      <option value="codex">Codex</option>
    </select>
    <button id="spawn">Spawn</button>
    <button id="kill">Kill</button>
    <button id="reload" title="Reload renderer, then reattach to the same PTY">Reload + reattach</button>
    <span id="state">idle</span>
  </header>
  <div id="term"></div>
  <footer>
    <span id="info"></span>
    <span id="latency">latency —</span>
    <span id="renderer"></span>
    <span id="log"></span>
  </footer>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="node_modules/@xterm/addon-unicode-graphemes/lib/addon-unicode-graphemes.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
