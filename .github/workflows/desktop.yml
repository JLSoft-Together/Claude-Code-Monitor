name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: apps/desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            files: apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # build.mjs --dist runs apps/layout-daemon `gradlew shadowJar` (Kotlin toolchain 21) for the XML layout preview.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # One dmg per arch, but npm only installs the host's node-pty prebuilt: fetch the other one too.
      - if: runner.os == 'macOS'
        run: npm install --no-save --force @lydell/node-pty-darwin-x64@1.2.0-beta.15 @lydell/node-pty-darwin-arm64@1.2.0-beta.15
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-monitor-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
